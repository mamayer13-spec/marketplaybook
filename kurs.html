<!DOCTYPE html>
<html class="dark" lang="de">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Kostenloser Videokurs — Market Playbook</title>

    <!--
      Variante B des Einstiegs (angelegt 29.8.2026).

      Warum es diese Seite gibt: Auf /form oeffnen nur rund 17 % der Besucher
      das Formular (02-audits/funnel/2026-08-24-form-seite-trichter.md). Zwei
      Verdachtsmomente stehen im Raum — die Leute steigen im VSL aus, und
      manche erkennen das Typeform-Element gar nicht als anklickbar. Diese
      Seite testet beides gegen: kein Video, keine Testimonials, kein FAQ,
      nur Versprechen, drei Punkte und der Button.

      A/B sauber messen: Den Link zu dieser Seite immer MIT eigenem
      utm_medium teilen, z. B.
        https://www.marketplaybook.de/kurs?utm_source=instagram&utm_medium=kurs-b
      Die Parameter werden unten ans Typeform durchgereicht und landen als
      Hidden Fields in jeder Antwort. Ohne das laesst sich im Typeform
      spaeter nicht unterscheiden, ob eine Eintragung von /form oder /kurs kam.

      noindex, weil die Seite inhaltlich eine Dublette von /form ist.
    -->
    <meta name="robots" content="noindex, follow" />

    <link rel="icon" href="/mp-zeichen-verlauf.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="apple-touch-icon" href="/icon-tab.png" />


    <!--
      Vercel Web Analytics, wie auf /form bewusst ausserhalb der
      Consent-Weiche: cookielos, zaehlt serverseitig ueber einen taeglich
      wechselnden Hash. Nur so gibt es eine Besucherzahl ueber alle, nicht
      nur ueber die Zustimmenden — und genau die braucht der A/B-Vergleich.
    -->
    <script defer src="/_vercel/insights/script.js"></script>
    <script>
      /* Klicks auf die Knöpfe zählen, die in den Trichter führen.
       *
       * Bis zum 12.9.2026 wusste das Cockpit, wie viele Menschen auf einer
       * Seite waren, aber nicht, wie viele von dort weitergeklickt haben.
       * Zwischen "800 Leser auf den Magazinartikeln" und "kein einziger
       * Klick auf den Kurs" liegt der ganze Unterschied.
       *
       * Ein einziger Zuhörer am Dokument statt eines Merkmals an jedem
       * Knopf: So zählt auch ein Link, den jemand später dazusetzt, ohne
       * dass er daran denken muss.
       *
       * Cookiefrei wie die Seitenmessung -- gezählt wird ein Ereignis ohne
       * jede Kennung, es entsteht kein Profil. */
      addEventListener("click", function (e) {
        var a = e.target && e.target.closest && e.target.closest("a[href]");
        if (!a) return;
        var ziel = a.getAttribute("href") || "";
        if (!/\/(form|videokurs|kurs)(\.html)?($|\?|#)/.test(ziel)) return;
        /* window.va ist die Warteschlange des Messskripts und existiert
           auch, bevor das Skript geladen ist. */
        if (typeof window.va !== "function") return;
        window.va("event", {
          name: "cta_klick",
          data: { von: location.pathname, zu: ziel },
        });
      });
    </script>

    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@100..900&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Seit 30.8.2026 im aktuellen Designsystem, wie /form und die
         Startseite: brain/06-knowledge/licht-auf-dunklem-grund.md.
         Kein Navy, kein Electric Blue, kein Space Grotesk mehr. */
      :root {
        --hintergrund: #0b0d12;
        --text: #f0f2f6;
        --text-leise: #a2a8b5;
        --leise: #767d8c;
        --akzent: #b3c5ff;
        --linie: #2e323d;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      /* Kurze Seite: ohne das haengt der Fuss mitten im Bild statt unten. */
      body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        background-color: var(--hintergrund);
        color: var(--text);
        font-family: Archivo, system-ui, -apple-system, sans-serif;
        font-weight: 300;
        line-height: 1.6;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      /* Raster + Lichtschein wie auf der Startseite, nur ruhiger. */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -2;
        background-image:
          linear-gradient(to right, rgba(240, 242, 246, 0.035) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(240, 242, 246, 0.035) 1px, transparent 1px);
        background-size: 44px 44px;
        -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 78%);
        mask-image: linear-gradient(to bottom, #000 0%, transparent 78%);
        pointer-events: none;
      }
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background:
          radial-gradient(900px 620px at 50% 30%, rgba(179, 197, 255, 0.16), transparent 68%),
          radial-gradient(700px 500px at 88% 6%, rgba(240, 242, 246, 0.09), transparent 70%);
      }

      main {
        /* Breiter als noetig, damit "Kostenloser Videokurs +
           Aktien-Watchlist" auf dem Desktop in eine Zeile passt. */
        max-width: 880px;
        margin: 0 auto;
        padding: 56px 20px 40px;
        text-align: center;
      }
      /* 48 statt mehr: auf einem 13-Zoll-Laptop (Sichtfenster ~770 px) muss
         der Knopf ohne Scrollen im Bild stehen. */
      @media (min-width: 640px) {
        main { padding-top: 110px; }
      }

      /* Zeichen plus Name statt gesperrter Versalien (24.9.2026). */
      .marke {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: -0.02em;
        color: var(--text);
        text-decoration: none;
        margin: 0 0 32px;
      }
      .marke .zeichen { width: 26px; height: 26px; flex: none; }

      h1 {
        font-size: 34px;
        font-weight: 200;
        text-wrap: balance;
        letter-spacing: -0.02em;
        line-height: 1.15;
        margin: 0 0 34px;
      }
      @media (min-width: 640px) {
        h1 { font-size: 46px; white-space: nowrap; }
        .vorzeile { font-size: 18px; }
      }
      /*
        "Hier geht es zum" steht als kleine Vorzeile ueber der Ueberschrift.
        So bleibt fuer den eigentlichen Versprechen-Satz eine Zeile uebrig
        statt dreier — auf dem Desktop steht er komplett in einer Zeile, auf
        dem Handy bricht er einmal vor "+ Aktien-Watchlist".
      */
      .vorzeile {
        font-size: 16px;
        font-weight: 400;
        color: var(--text-leise);
        margin: 0 0 8px;
      }
      /* Der Watchlist-Teil ist abgesetzt: laut Claudio tragen sich viele
         wegen der Watchlist ein, nicht wegen des Kurses. */
      h1 .plus {
        color: var(--akzent);
        white-space: nowrap;
      }




      /*
        Der Pfeil zeigt auf den Typeform-Knopf. Er steht hier, weil der
        Verdacht im Raum steht, dass Besucher das Typeform-Element gar nicht
        als anklickbar erkennen.
      */
      .pfeil {
        display: block;
        margin: 0 auto 14px;
        color: var(--akzent);
        opacity: 0.8;
        animation: wippen 1.8s ease-in-out infinite;
      }
      @keyframes wippen {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(6px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .pfeil,
        .knopf-feld,
        .knopf-feld::after {
          animation: none;
        }
      }

      /*
        Das Typeform bringt seinen eigenen, kraeftig blauen Knopf mit
        ("Zum kostenlosen Kurs!", Beschriftung wird im Typeform gesetzt).
        Deshalb hier KEIN eigener blauer Rahmen — das waere Blau auf Blau.
        Nur ein Schein darunter, damit der Knopf aus der Seite heraussteht.
      */
      .knopf-feld {
        display: block;
        position: relative;
        margin: 0 auto;
        max-width: 420px;
        border-radius: 14px;
        filter: drop-shadow(0 14px 34px rgba(240, 242, 246, 0.22));
        /* Leichtes Groesser-Kleiner, damit der Knopf aus der sonst voellig
           ruhigen Seite heraussticht. Bewusst klein gehalten (4 %) — mehr
           wirkt billig und laesst den Text flimmern. */
        animation: knopf-wippen 2.6s ease-in-out infinite;
      }
      /*
        Sonar: ein Ring, der aus dem Knopf herauslaeuft. Liegt in einem
        eigenen Element, damit die Animation den Knopf selbst nicht anfasst,
        und ist klickdurchlaessig — sonst schluckt er den Klick aufs
        Typeform.
      */
      .knopf-feld::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 14px;
        pointer-events: none;
        animation: sonar 2.6s ease-out infinite;
      }
      @keyframes knopf-wippen {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.04); }
      }
      @keyframes sonar {
        0% { box-shadow: 0 0 0 0 rgba(179, 197, 255, 0.42); }
        70% { box-shadow: 0 0 0 24px rgba(179, 197, 255, 0); }
        100% { box-shadow: 0 0 0 0 rgba(179, 197, 255, 0); }
      }
      /*
        Typeform setzt seinem Knopf eine feste Breite von 390 px. Auf dem
        Handy ist der Textbereich aber nur 350 px breit — ohne diese Zeile
        haengt der Knopf rechts aus der Seite heraus (am 29.8.2026 im
        390-px-Rahmen gemessen). Deshalb hart auf die Spaltenbreite zwingen.
      */
      .knopf-feld button {
        width: 100% !important;
        max-width: 100% !important;
        /*
          Typeform setzt dem Knopf box-sizing: content-box. Ohne die Zeile
          hier kommt die Innenpolsterung auf die 100 % obendrauf: gemessen
          350 px Spalte, 440 px Knopf.
        */
        box-sizing: border-box !important;
        /*
          Typeform liefert 27 px Schrift und 45 px Polsterung links/rechts.
          Die Beschriftung braucht damit 440 px; sobald der Knopf schmaler
          ist, kuerzt Typeform sie zu "Zum kostenlosen ...". Kleinere
          Polsterung und Schrift, damit der ganze Satz stehen bleibt.
        */
        padding: 20px !important;
        font-size: 22px !important;
        /* Ohne das sitzt die Beschriftung wegen der 27-px-Zeilenhoehe von
           Typeform sichtbar zu tief im Knopf. */
        line-height: 1.2 !important;
        /* Hell statt Typeform-Blau, wie auf /form. Manuel am 30.8.2026.
           Das kraeftige Blau war der letzte Rest des alten Designs auf
           dieser Seite - und der einzige verbliebene optische Unterschied
           zwischen den beiden Varianten, der nichts mit dem Test zu tun
           hat. */
        background: var(--text) !important;
        color: #0b0d12 !important;
        border: 0 !important;
        border-radius: 12px !important;
        font-family: Archivo, system-ui, sans-serif !important;
        font-weight: 500 !important;
        letter-spacing: -0.01em !important;
        transition: opacity 200ms ease;
      }
      .knopf-feld button:hover { opacity: 0.88; }

      .vertrauen {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 12px;
        color: var(--akzent);
        opacity: 0.75;
        margin: 22px 0 0;
      }

      /*
        Enger auf dem Handy. Gemessen am 29.8.2026 im 390-px-Rahmen: der
        Typeform-Knopf startete bei 800 px. Der Instagram-In-App-Browser
        frisst rund 140 px von 844, sichtbar sind also nur ~700 px — der
        Knopf lag damit unter der Falz. Genau das soll diese Seite nicht
        wiederholen. Alle Abstaende hier sind darauf gerechnet, dass der
        Knopf ohne Scrollen im Bild steht.
      */
      @media (max-width: 639px) {
        main { padding-top: 64px; }
        .marke { margin-bottom: 20px; }
        h1 { font-size: 25px; margin-bottom: 26px; }
        .vorzeile { font-size: 15px; }
        .pfeil { margin-bottom: 10px; width: 22px; height: 22px; }
        .knopf-feld button { font-size: 19px !important; padding: 18px 14px !important; }
        .vertrauen { margin-top: 18px; }
        footer { margin-top: 36px; }
      }

      footer {
        border-top: 1px solid var(--linie);
        margin-top: auto;
        padding: 24px 20px 40px;
        text-align: center;
      }
      footer nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px 22px;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 12px;
      }
      footer a {
        color: var(--leise);
        text-decoration: none;
      }
      footer a:hover { color: var(--text); }
      footer p {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 12px;
        color: var(--leise);
        opacity: 0.75;
        margin: 16px 0 0;
      }
    
      /* =================================================================
         Angleichung an die Kursseite und die App (24.9.2026): blaues
         Licht in den Logofarben statt Raster, Logo oben links statt
         mittig, runder Knopf.
         ================================================================= */
      body::before { display: none; }
      body::after {
        background:
          radial-gradient(1500px 780px at 50% -14%, rgba(150, 172, 240, 0.26), rgba(114, 136, 206, 0.09) 42%, transparent 68%),
          radial-gradient(900px 620px at 6% 18%, rgba(58, 88, 190, 0.22), transparent 62%),
          radial-gradient(1000px 700px at 100% 70%, rgba(114, 136, 206, 0.16), transparent 64%),
          radial-gradient(1200px 800px at 30% 110%, rgba(38, 62, 150, 0.22), transparent 60%);
      }
      .marke {
        position: absolute;
        top: 24px;
        left: 20px;
        margin: 0;
      }
      @media (min-width: 640px) { .marke { top: 28px; left: 32px; } }
      .knopf-feld, .knopf-feld::before, .knopf-feld::after { border-radius: 999px !important; }
      .knopf-feld button { border-radius: 999px !important; }
    </style>
  </head>

  <body>
    <main>
      <a class="marke" href="/"><svg class="zeichen" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><defs><linearGradient id="mp-kopf-v" x1="2.8" y1="4.6" x2="29.2" y2="26.5" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#7288CE"/></linearGradient><linearGradient id="mp-kopf-h" x1="2.8" y1="4.6" x2="29.2" y2="26.5" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#CBD9FF"/><stop offset="1" stop-color="#263E96"/></linearGradient></defs><g transform="translate(0 0.95)"><path d="M14.4 9 C 10 5.5, 6.2 4.6, 2.8 5.5 V21.5 C 6.2 20.8, 10 21.6, 14.4 25.5 Z" fill="url(#mp-kopf-v)" stroke="url(#mp-kopf-v)" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M17.6 9 C 22 5.5, 25.8 4.6, 29.2 5.5 V21.5 C 25.8 20.8, 22 21.6, 17.6 25.5 Z" fill="url(#mp-kopf-h)" stroke="url(#mp-kopf-h)" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/></g></svg><span>Market Playbook</span></a>

      <p class="vorzeile">Hier geht es zum</p>

      <h1>Kostenloser Videokurs <span class="plus">+ Aktien-Watchlist</span></h1>

      <svg class="pfeil" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>

      <script>
        /* Rueckmeldungen des Typeform-Embeds an Vercel Web Analytics —
         * gleiche Ereignisnamen wie auf /form, damit sich beide Varianten
         * vergleichen lassen.
         *
         * Muss VOR embed.js stehen: Typeform loest die Namen aus
         * data-tf-on-ready / data-tf-on-submit in dem Moment auf window auf,
         * in dem embed.js das Element einliest.
         *
         * Seit 6.9.2026 nicht mehr GA4: das durfte erst nach Zustimmung
         * laden, damit fehlte in der Messung genau der Teil der Leute, der
         * den Cookie-Hinweis weggeklickt hat. Vercel setzt keine Cookies,
         * braucht keine Zustimmung und misst deshalb alle. window.va ist die
         * Warteschlange von /_vercel/insights/script.js. */
        function melde(name) {
          if (typeof window.va !== "function") return;
          window.va("event", { name: name });
        }
        window.formularBereit = function () {
          melde("typeform_opened");
        };
        window.formularAbgeschickt = function () {
          melde("typeform_completed");
        };
      </script>

      <!--
        Gleiches Typeform wie auf /form (01KWCA6TY1V0SVA1RCZSWJ0TA2), damit
        der Test nur die Seite vergleicht und nicht zwei Formulare.
        data-tf-transitive-search-params reicht die UTM-Parameter aus der
        Adresse durch; im Typeform sind sie seit 20.8.2026 als Hidden Fields
        angelegt.
      -->
      <div class="knopf-feld">
        <button type="button" data-tf-popup="hdO58qyl" data-tf-opacity="100" data-tf-size="100" data-tf-iframe-props="title=Market Playbook" data-tf-medium="snippet" data-tf-transitive-search-params="utm_source,utm_medium,utm_campaign" data-tf-hidden="utm_source=,utm_medium=,utm_campaign=" data-tf-on-ready="formularBereit" data-tf-on-submit="formularAbgeschickt">Kurs kostenlos freischalten</button>
      </div>
      <script src="//embed.typeform.com/next/embed.js"></script>

      <p class="vertrauen">Kostenlos &middot; Keine Kreditkarte &middot; Kein Abo</p>

    </main>

    <footer>
      <nav>
        <a href="/impressum.html">Impressum</a>

        <a href="/datenschutz.html">Datenschutzerkl&auml;rung</a>
        <a href="/haftungsausschluss.html">Haftungsausschluss</a>
      </nav>
      <p>&copy; 2026 Market Playbook</p>
    </footer>
  </body>
</html>
